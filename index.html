<!DOCTYPE html>
<html lang="en">

  <head>

    <!-- starting code -->
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content = "IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

    <title>Wordle</title>

    <link rel = "stylesheet" href="style.css">

    <!-- link outside libaries toastr and animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.css" rel = "stylesheet"/>
    <link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  </head>

  <body>

    <h1 id = "game-title">Wordle</h1>

    <button id = "stats-button" aria-label = "Stats">📊</button>

    <div id = "theme-menu">

      <!-- creation of button classes so far have 3 themes -->
      <button class = "theme-button" data-theme = "classic">Classic</button>
      <button class = "theme-button" data-theme = "halloween">Halloween</button>
      <button class = "theme-button" data-theme = "christmas">Christmas</button>
    </div>

  <div id = "game-container">

    <div id = "game-board">

    </div>
  
    <!-- create on screen keyboard -->
    <div id = "keyboard-cont">

        <div class = "first-row">
            <button class = "keyboard-button">q</button>
            <button class = "keyboard-button">w</button>
            <button class = "keyboard-button">e</button>
            <button class = "keyboard-button">r</button>
            <button class = "keyboard-button">t</button>
            <button class = "keyboard-button">y</button>
            <button class = "keyboard-button">u</button>
            <button class = "keyboard-button">i</button>
            <button class = "keyboard-button">o</button>
            <button class = "keyboard-button">p</button>
        </div>

        <div class = "second-row">
            <button class = "keyboard-button">a</button>
            <button class = "keyboard-button">s</button>
            <button class = "keyboard-button">d</button>
            <button class = "keyboard-button">f</button>
            <button class = "keyboard-button">g</button>
            <button class = "keyboard-button">h</button>
            <button class = "keyboard-button">j</button>
            <button class = "keyboard-button">k</button>
            <button class = "keyboard-button">l</button>
        </div>

        <div class = "third-row">
            <button class = "keyboard-button">Del</button>
            <button class = "keyboard-button">z</button>
            <button class = "keyboard-button">x</button>
            <button class = "keyboard-button">c</button>
            <button class = "keyboard-button">v</button>
            <button class = "keyboard-button">b</button>
            <button class = "keyboard-button">n</button>
            <button class = "keyboard-button">m</button>
            <button class = "keyboard-button">Enter</button>
        </div>

    </div>

    <!-- added play again feature so we dont have to refresh everytime -->
    <button id = "play-again">Play Again</button>

  </div>

  <!-- new html structure for stats information -->
    <div id = "stats-model">
      <div id = "stats-content">
        <button id = "stats-close">✕</button>
        <h2>Statistics</h2>
        <div class = "stats-grid">
            <div class = "stat"><span id = "stat-played">0</span><label>Matches Played</label></div>
            <div class = "stat"><span id = "stat-winpct">0</span><label>Win %</label></div>
            <div class = "stat"><span id = "stat-streak">0</span><label>Current Streak</label></div>
            <div class = "stat"><span id = "stat-maxstreak">0</span><label>Max Streak</label></div>
        </div>
        <h3>Guess Distribution</h3>
        <div id = "guess-distribution"></div>
      </div>
    </div>

  <!-- imported js query for game features ran into issues with hash but fixed due to syntax error -->
    <script src = "https://code.jquery.com/jquery-3.6.0.min.js"
    integrity = "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    crossorigin = "anonymous"></script>
    <script src = "https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
    <script src = "script.js" type = "module"></script>

  </body>
</html>
